name: Build

on:
  push:
    branches: ['**']
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ExcelNumberFormat.sln -c Release -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test test/ExcelNumberFormat.Tests/ExcelNumberFormat.Tests.csproj -c Release --no-build --logger trx

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: "**/*.nupkg"
